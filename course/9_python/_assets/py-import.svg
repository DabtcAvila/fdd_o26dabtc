<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-label="Arriba, la celda from trabajo import calcula. Debajo, dos columnas con las carpetas de sys.path en el orden en que Python las recorre buscando trabajo.py. Izquierda, el kernel corre en por_dentro: la libreria estandar no lo tiene, la carpeta de trabajo, que es por_dentro, si lo tiene y gana. Derecha, el kernel corre en la raiz del fork: ni la libreria estandar, ni la carpeta de trabajo, ni los paquetes del .venv lo tienen, y sale ModuleNotFoundError. Al pie: os.getcwd dice cual es la carpeta de trabajo, y un nombre sin ruta se busca ahi"><rect x="0" y="0" width="1080" height="520" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="44" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Dónde busca Python lo que importas</text><rect x="340" y="64" width="400" height="44" rx="8" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="540" y="92" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" text-anchor="middle">from trabajo import calcula</text><text x="270" y="140" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">kernel en por_dentro/</text><text x="810" y="140" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">kernel en la raíz del fork</text><rect x="50" y="160" width="440" height="64" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="76" y="199" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">1</text><text x="100" y="190" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="start">librería estándar</text><text x="100" y="212" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">no está trabajo.py</text><line x1="76" y1="226" x2="76" y2="240" stroke="#4a7a63" stroke-width="1.5" marker-end="url(#f4a7a63)"/><rect x="50" y="242" width="440" height="64" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="76" y="281" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">2</text><text x="100" y="272" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="start">carpeta de trabajo: por_dentro/</text><text x="100" y="294" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">aquí está trabajo.py → gana</text><line x1="76" y1="308" x2="76" y2="322" stroke="#4a7a63" stroke-width="1.5" marker-end="url(#f4a7a63)"/><rect x="50" y="324" width="440" height="64" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="76" y="363" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">3</text><text x="100" y="354" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="start">.venv/…/site-packages</text><text x="100" y="376" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">ya no se busca</text><rect x="590" y="160" width="440" height="64" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="616" y="199" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">1</text><text x="640" y="190" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="start">librería estándar</text><text x="640" y="212" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">no está trabajo.py</text><line x1="616" y1="226" x2="616" y2="240" stroke="#4a7a63" stroke-width="1.5" marker-end="url(#f4a7a63)"/><rect x="590" y="242" width="440" height="64" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="616" y="281" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">2</text><text x="640" y="272" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="start">carpeta de trabajo: raíz del fork</text><text x="640" y="294" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">no está trabajo.py</text><line x1="616" y1="308" x2="616" y2="322" stroke="#4a7a63" stroke-width="1.5" marker-end="url(#f4a7a63)"/><rect x="590" y="324" width="440" height="64" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="616" y="363" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">3</text><text x="640" y="354" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="start">.venv/…/site-packages</text><text x="640" y="376" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">tampoco → ModuleNotFoundError</text><text x="540.0" y="440" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">os.getcwd() dice cuál es la carpeta de trabajo</text><text x="540.0" y="470" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">trabajo.py, revisa_esto.py y ventas.csv se buscan ahí: un nombre sin ruta es relativo a ella</text></svg>