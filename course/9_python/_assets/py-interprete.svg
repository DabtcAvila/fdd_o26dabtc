r="middle">ejecuta el bytecode</text><line x1="325" y1="214" x2="325" y2="240" stroke="#ffc857" stroke-width="1.8" marker-end="url(#fffc857)"/><rect x="179.5" y="248" width="291" height="28" rx="6" fill="#0b0f12" stroke="#ffc857" stroke-width="1.2"/><text x="325" y="267" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">errores de sintaxis: aquí</text><text x="325" y="300" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">antes de que corra una sola línea</text><line x1="735" y1="214" x2="735" y2="240" stroke="#ff8a7a" stroke-width="1.8" marker-end="url(#fff8a7a)"/><rect x="551.0" y="248" width="368" height="28" rx="6" fill="#0b0f12" stroke="#ff8a7a" stroke-width="1.2"/><text x="735" y="267" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">errores de tipo: aquí, al correr</text><text x="735" y="300" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">sólo si esa línea llega a ejecutarse</text></svg>