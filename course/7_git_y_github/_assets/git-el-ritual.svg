<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="580" viewBox="0 0 1080 580" role="img" aria-label="Cuatro carriles verticales con el flujo completo. El primero, ponte al dia, sincroniza main con el repositorio del curso y actualiza tu fork. El segundo, abre tu espacio, crea la branch de la tarea y copia el codigo a tu carpeta. El tercero, entrega, revisa el estado, agrega por ruta, commitea, sube la branch y abre el pull request. El cuarto, cierra, regresa a main, vuelve a sincronizar y borra la branch"><rect x="0" y="0" width="1080" height="580" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">El ritual: cuatro bloques, siempre en este orden</text><rect x="30" y="80" width="246" height="392" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><circle cx="153" cy="118" r="24" fill="#0b0f12" stroke="#7ef29d" stroke-width="2"/><text x="153" y="124" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">A</text><text x="153" y="168" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Ponte al día</text><rect x="44" y="200" width="218" height="36" rx="7" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="153" y="224" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="middle">git switch main</text><rect x="44" y="244" width="218" height="36" rx="7" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="153" y="268" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="middle">git fetch upstream</text><rect x="44" y="288" width="218" height="36" rx="7" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="153" y="312" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="middle">git merge upstream/main</text><rect x="44" y="332" width="218" height="36" rx="7" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="153" y="356" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="middle">git push origin main</text><text x="153" y="448" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">Tu main queda igual al del curso.</text><rect x="288" y="80" width="246" height="392" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><circle cx="411" cy="118" r="24" fill="#0b0f12" stroke="#ffc857" stroke-width="2"/><text x="411" y="124" fill="#ffc857" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">B</text><text x="411" y="168" fill="#ffc857" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Abre tu espacio</text><rect x="302" y="200" width="218" height="36" rx="7" fill="#0b0f12" stroke="#ffc857" stroke-width="1.2"/><text x="411" y="224" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="middle">git switch -c tarea-07-git</text><rect x="302" y="244" width="218" height="36" rx="7" fill="#0b0f12" stroke="#ffc857" stroke-width="1.2"/><text x="411" y="268" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="middle">mkdir -p estudiantes/$U/07_git</text><rect x="302" y="288" width="218" height="36" rx="7" fill="#0b0f12" stroke="#ffc857" stroke-width="1.2"/><text x="411" y="312" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="middle">cp -r codigo/07_git/. → ahí</text><rect x="302" y="376" width="218" height="36" rx="7" fill="#0b0f12" stroke="#ffc857" stroke-width="1.2"/><text x="411" y="400" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="middle">y trabaja sólo ahí dentro</text><text x="411" y="448" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">Nunca en main. Sólo tu carpeta.</text><rect x="546" y="80" width="246" height="392" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><circle cx="669" cy="118" r="24" fill="#0b0f12" stroke="#6fd8e8" stroke-width="2"/><text x="669" y="124" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">C</text><text x="669" y="168" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Entrega</text><rect x="560" y="200" width="218" height="36" rx="7" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.2"/><text x="669" y="224" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="middle">git status</text><rect x="560" y="244" width="218" height="36" rx="7" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.2"/><text x="669" y="268" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="middle">git add estudiantes/$U/07_git</text><rect x="560" y="288" width="218" height="36" rx="7" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.2"/><text x="669" y="312" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="middle">git status</text><rect x="560" y="332" width="218" height="36" rx="7" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.2"/><text x="669" y="356" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="middle">git commit -m "..."</text><rect x="560" y="376" width="218" height="36" rx="7" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.2"/><text x="669" y="400" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="middle">git push -u origin tarea-07-git</text><text x="669" y="448" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">Y abre el pull request.</text><rect x="804" y="80" width="246" height="392" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><circle cx="927" cy="118" r="24" fill="#0b0f12" stroke="#c9a7ff" stroke-width="2"/><text x="927" y="124" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">D</text><text x="927" y="168" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Cierra</text><rect x="818" y="200" width="218" height="36" rx="7" fill="#0b0f12" stroke="#c9a7ff" stroke-width="1.2"/><text x="927" y="224" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="middle">git switch main</text><rect x="818" y="244" width="218" height="36" rx="7" fill="#0b0f12" stroke="#c9a7ff" stroke-width="1.2"/><text x="927" y="268" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="middle">git fetch upstream</text><rect x="818" y="288" width="218" height="36" rx="7" fill="#0b0f12" stroke="#c9a7ff" stroke-width="1.2"/><text x="927" y="312" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="middle">git merge upstream/main</text><rect x="818" y="332" width="218" height="36" rx="7" fill="#0b0f12" stroke="#c9a7ff" stroke-width="1.2"/><text x="927" y="356" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="middle">git push origin main</text><rect x="818" y="376" width="218" height="36" rx="7" fill="#0b0f12" stroke="#c9a7ff" stroke-width="1.2"/><text x="927" y="400" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="middle">git branch -d tarea-07-git</text><text x="927" y="448" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">git branch: sólo main.</text><line x1="262" y1="276" x2="282" y2="276" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><line x1="520" y1="276" x2="540" y2="276" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><line x1="778" y1="276" x2="798" y2="276" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><text x="540.0" y="512" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Paso 0, una sola vez en el semestre: el fork en el navegador, y después git remote rename origin upstream + git remote add origin.</text><text x="540.0" y="540" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">Los dos git status del bloque C no son adorno. Y sin el bloque D, la semana que viene empiezas parado en la branch equivocada.</text></svg>